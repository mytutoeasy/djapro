{% extends "base.html" %}

{% block title %}Supprimer{% endblock %}

{% block content %}
<h1>Supprimer l'étudiant</h1>
<p>Voulez-vous vraiment supprimer <strong>{{ student }}</strong> ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'student_detail' student.pk %}">Annuler</a>
</form>
{% endblock %}
