{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1>Étudiants</h1><a class="btn btn-primary" href="/students/add/">+ Ajouter</a></div><table class="table table-striped bg-white"><thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th></tr></thead><tbody>{% for s in students %}<tr><td>{{ s.first_name }} {{ s.last_name }}</td><td>{{ s.email }}</td><td>{{ s.phone }}</td></tr>{% empty %}<tr><td colspan="3">Aucun étudiant.</td></tr>{% endfor %}</tbody></table>{% endblock %}
