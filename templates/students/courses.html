{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1>Cours</h1><a class="btn btn-primary" href="/courses/add/">+ Ajouter</a></div><table class="table table-striped bg-white"><thead><tr><th>Code</th><th>Nom</th><th>Prix</th><th>Capacité</th><th>Statut</th></tr></thead><tbody>{% for c in courses %}<tr><td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.price }}</td><td>{{ c.capacity }}</td><td>{{ c.get_status_display }}</td></tr>{% empty %}<tr><td colspan="5">Aucun cours.</td></tr>{% endfor %}</tbody></table>{% endblock %}
