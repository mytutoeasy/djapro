<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Students{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'student_list' %}">Students</a> |
        <a href="{% url 'student_create' %}">Ajouter</a>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
