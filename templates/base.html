<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django School{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Django School</a>
    {% if user.is_authenticated %}
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-light" href="/students/">Étudiants</a>
        <a class="btn btn-sm btn-outline-light" href="/courses/">Cours</a>
        <a class="btn btn-sm btn-outline-light" href="/enrolments/">Inscriptions</a>
        {% if user.is_staff %}<a class="btn btn-sm btn-warning" href="/admin/">Admin</a>{% endif %}
        <span class="text-white small ms-2">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-outline-danger">Déconnexion</button></form>
      </div>
    {% else %}
      <div><a class="btn btn-sm btn-outline-light me-2" href="{% url 'login' %}">Connexion</a><a class="btn btn-sm btn-primary" href="{% url 'register' %}">Créer un compte</a></div>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
